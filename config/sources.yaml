# Job sources + HTTP politeness. Access rules per source: docs/SOURCES.md.
http:
  user_agent: "job-copilot/2.0 (personal, non-commercial; +https://github.com/Aditya-Barnwal/job-copilot)"
  timeout_sec: 20
  default_rate_per_sec: 1.0      # per host
  max_retries: 3                 # 429 / 5xx only, honouring Retry-After
  host_rates:                    # requests/sec per host (subdomains inherit)
    bangalorestartupmap.com: 0.2   # <= 1 request / 5 s, homepage included (D12)
  # Documented public APIs only, each with a reason. These skip the robots.txt
  # check but are still rate-limited. Robots results checked 2026-11-11:
  #   boards-api.greenhouse.io  200, Disallow: /embed/ only  -> /v1/boards allowed, no exemption
  #   api.lever.co              200, Allow: /, Crawl-delay: 1 -> allowed (delay honoured)
  #   *.myworkdayjobs.com       200, Disallow: /refreshFacet/ -> /wday/cxs allowed
  #   api.ashbyhq.com           401 (robots.txt unreadable)    -> exempt below
  #   api.adzuna.com, jsearch.p.rapidapi.com  "Disallow: /"    -> NOT exempted; both are
  #     key-gated and unused today. Decide explicitly if you ever add keys.
  robots_exempt_hosts:
    "api.ashbyhq.com/posting-api/job-board/": "Ashby public Job Postings API (developers.ashbyhq.com) built for job boards; its robots.txt answers 401 so it cannot be read"
    "api.gem.com/job_board/v0/": "Gem public Job Board API (/job_board/v0/{slug}/job_posts) documented for career sites; its robots.txt answers 403 so it cannot be read. Exempted at the user's request 2026-11-11 (PromptQL)."

  # DO-NOT-AUTOMATE (docs/SOURCES.md): the HTTP client refuses these hosts and all
  # their subdomains outright, whoever the caller is. Link out to them instead.
  denied_hosts:
    - workatastartup.com
    - ycombinator.com
    - linkedin.com
    - naukri.com
    - indeed.com
    - wellfound.com
    - glassdoor.com

# Job boards (Phase 1). Access rules + attribution duties: docs/SOURCES.md.
# Each board's jobs carry "via <board>" attribution; apply_rule says where Apply
# must point when we did NOT also find the job on the employer's own ATS.
boards:
  himalayas:
    enabled: true
    attribution: {name: Himalayas, url: "https://himalayas.app"}
    apply_rule: source_link          # terms: every Apply must use applicationLink
    queries: ["software engineer", "backend engineer", "machine learning engineer", "ai engineer", "full stack engineer"]
    max_pages_per_query: 1           # robots.txt disallows ?page= on /jobs (checked 2026-11-11): page 1 only; widen via more queries, never by dodging the rule
    drop_expired: true
  workingnomads:
    enabled: true
    attribution: {name: Working Nomads, url: "https://www.workingnomads.com"}
    apply_rule: prefer_ats
    categories: [development]
  jobspresso:
    enabled: true
    attribution: {name: Jobspresso, url: "https://jobspresso.co"}
    apply_rule: prefer_ats
    poll_hours: 2                    # feed only holds the last ~10 posts
    store: minimal                   # personal-use terms: title/company/location/link only
  remoteok:
    enabled: true
    attribution: {name: Remote OK, url: "https://remoteok.com"}   # followable link required
    apply_rule: prefer_ats
  weworkremotely:
    enabled: true
    attribution: {name: We Work Remotely, url: "https://weworkremotely.com"}
    apply_rule: prefer_ats
    feeds: ["https://weworkremotely.com/categories/remote-programming-jobs.rss",
            "https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss",
            "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"]
    store: minimal

  jobicy:
    enabled: true
    attribution: {name: Jobicy, url: "https://jobicy.com"}   # credit with a direct link
    apply_rule: source_link          # terms: Apply -> original job URL from the feed
    queries: [{geo: apac, count: 50}, {count: 50}]
  realworkfromanywhere:
    enabled: true
    attribution: {name: Real Work From Anywhere, url: "https://www.realworkfromanywhere.com"}
    apply_rule: prefer_ats           # never follow /go/ links (robots)
    store: minimal
  fourdayweek:
    enabled: true
    attribution: {name: 4 Day Week, url: "https://4dayweek.io"}   # link back required
    apply_rule: source_link
    queries: [{work_arrangement: remote, category: engineering, limit: 50}]   # /api/v2 only, page 1
  cryptojobslist:
    enabled: true
    attribution: {name: CryptoJobsList, url: "https://cryptojobslist.com"}
    apply_rule: prefer_ats
    store: minimal
  hasjob:
    enabled: true
    attribution: {name: Hasjob, url: "https://hasjob.co"}
    apply_rule: prefer_ats
    store: minimal
  remotecom:
    enabled: true
    attribution: {name: Remote, url: "https://apply.remote.com"}
    apply_rule: source_link
    company_name: Remote
  arbeitnow:
    enabled: true
    attribution: {name: Arbeitnow, url: "https://www.arbeitnow.com"}
    apply_rule: source_link
    remote_only: true                # page 1 only; Germany-heavy
  nodesk:
    enabled: true
    attribution: {name: NoDesk, url: "https://nodesk.co"}
    apply_rule: prefer_ats
    store: minimal                   # robots Content-Signal use=reference, ai-train=no

  # Community lists (Phase 1b)
  hn_hiring:
    enabled: true
    attribution: {name: "Hacker News — Who is hiring", url: "https://news.ycombinator.com/submitted?id=whoishiring"}
    apply_rule: source_link
    user: whoishiring
    max_item_fetches: 6
    max_roles_per_post: 5
    max_bytes: 10000000
    deadline_sec: 90
  speedyapply:
    enabled: true
    attribution: {name: "speedyapply (GitHub)", url: "https://github.com/speedyapply/2027-SWE-College-Jobs"}
    apply_rule: source_link
    repo: speedyapply/2027-SWE-College-Jobs   # renamed every season
    branch: main
    files:
      - {path: NEW_GRAD_INTL.md, keep: all}
      - {path: NEW_GRAD_USA.md, keep: remote}
  simplify:
    enabled: true
    attribution: {name: "SimplifyJobs (GitHub)", url: "https://github.com/SimplifyJobs/New-Grad-Positions"}
    apply_rule: source_link
    repo: SimplifyJobs/New-Grad-Positions
    branch: dev
    path: .github/scripts/listings.json
    max_age_days: 60
    max_bytes: 25000000
    deadline_sec: 180

# Company discovery (Phase 1). Feeds the companies table; jobs still come from ATS APIs.
discovery:
  yc_oss:
    enabled: true
    url: "https://yc-oss.github.io/api/companies/hiring.json"
  bangalore_startup_map:
    enabled: true
    url: "https://bangalorestartupmap.com/"
    refresh: daily                   # in the 19:00 run; conditional GET + diff-based company pages
    company_page_delay_sec: 5
    attribution: {name: Bangalore Startup Map, url: "https://bangalorestartupmap.com"}
