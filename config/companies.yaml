  - { name: PromptQL, sector: tech, connector: gem, slug: promptql, tier: funded, tier_reason: "VC-backed (formerly Hasura)", verify: true, note: "formerly Hasura (greenhouse:hasura 404). Not live-verified: blocked until api.gem.com is robots-exempted" }
