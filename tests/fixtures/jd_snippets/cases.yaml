# YOE v2 cases. Each case: title, text, and the expected reading.
#   min / max: years (null = none found); preferred: soft bar only; fresher: fresher_friendly.
# source: db-copy = trimmed from a temp copy of the local jobs DB (company JD text only);
#         written  = hand-written to cover a format or guard.
cases:
  - id: affirm_swe2_1_5
    source: db-copy
    title: "Software Engineer II, Backend (AI Agents)"
    text: |
      Affirm is reinventing credit to make it more honest and friendly. Over the last 10 years
      our engineering team has grown across 5 countries.
      What you'll do
      · Own services end to end and participate in the interview process.
      What We Look For
      · You have a total of 1.5+ years of experience as a software engineer.
      · You have experience shipping web apps using Python or Kotlin.
      Pay Grade - L
      Equity Grade - 5
    expect: {min: 1.5, max: null, preferred: false, fresher: false}

  - id: affirm_swe2_bare_bullet
    source: db-copy
    title: "Software Engineer II, Backend (Infrastructure Platform)"
    text: |
      This position requires either equivalent practical experience or a Bachelor's degree in a related field
      1.5+ years of experience as a software engineer
      Strong proficiency in Python, with experience in distributed systems
    expect: {min: 1.5, max: null, preferred: false, fresher: false}

  - id: affirm_mle2_2plus
    source: db-copy
    title: "Machine Learning Engineer II (Fraud)"
    text: |
      What we look for
      - You have a total of 2+ years of experience as a machine learning engineer or a PhD in a relevant field.
      - Experience with a deep learning framework (PyTorch preferred).
    expect: {min: 2, max: null, preferred: false, fresher: false}

