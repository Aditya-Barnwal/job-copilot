<!doctype html>
<!-- Sanitized from a real Keka posting page (/careers/jobdetails/<id>), captured
     read-only on 2026-11-19: scripts, tracking, tenant ids, company names and the
     description removed. Keka's app script sends the #apply-job click to
     /careers/applyjob/<id>; the small script below stands in for it. -->
<html lang="en"><head><meta charset="utf-8"><title>Software Engineer</title></head>
<body>
<div class="nav-bar-container top-navbar"><div class="kch-my-8">
<a class="kch-company-logo kch-d-flex" href=""><img alt="logo" height="40"></a>
<div attr="short-name" class="kch-text-heading">Example Co</div></div></div>
<div class="job-details-container pb-5">
<div class="banner mb-60"><div class="max-w-800 mx-auto h-100"><div class="col-md-10 col-sm-12 p-4">
<div class="pb-4"><h1 class="font-large-5 font-weight-normal m-0 kch-text-heading" title="Software Engineer">Software Engineer</h1></div>
<div class="m-0 font-regular row align-items-center">
<div class="d-flex align-items-center pr-4 pb-3"><span class="icon icon-sm ki-user-tie pr-2"></span><span>1 - 3 Years</span></div>
<div class="d-flex align-items-center pr-4 pb-3"><span class="icon icon-sm ki-location pr-2"></span><span>Bengaluru</span></div>
<div class="d-flex align-items-center pr-4 pb-3"><span class="icon icon-sm ki-briefcase pr-2"></span><span>Full-Time</span></div>
</div></div></div></div>
<div class="max-w-800 mx-auto"><div class="row no-gutters justify-content-between">
<div class="col-lg-8 col-sm-12 mb-5 p-4">
<div class="job-description-container "><p>Build and run backend services in Python.</p></div>
<div class="mt-3"><p class="font-weight-600 text-large mb-2">Required Skills</p>
<div class="d-flex flex-wrap"><span class="bg-secondary px-3">python</span></div></div>
</div>
<div class="col-lg-4 col-sm-12 mb-5 p-4"><div class="sticky-job h-500">
<div class="btn-container mb-5 col-md-9 col-sm-12 d-lg-block p-0">
<button class="btn btn-info btn-lg w-100 text-white" id="apply-job">Apply for this job</button>
</div>
<div class="social-links mb-5"><span class="font-regular d-block mb-2 ">Share with someone awesome</span>
<div class="social-links-list d-inline-flex">
<a class="ki-linkedin mx-2" target="_blank" title="Share Job on LinkedIn" href="http://www.linkedin.com/shareArticle?mini=true&amp;url=https://example.keka.com/careers/jobdetails/1"></a>
</div></div>
<div class="other-openings-container"><p class="text-uppercase font-large mb-3">Similar Openings</p>
<div class="other-openings-list"><div class="mb-4"><a class="header-4 text-link d-block" href="keka_job.html?other=1">Product Intern</a></div></div></div>
<div class="mb-5 mt-3"><a id="all-jobs" class="text-link font-regular">View all job openings</a></div>
</div></div>
</div></div>
</div>
<script>
  document.getElementById('apply-job').addEventListener('click', function () {
    location.href = 'keka_apply.html';
  });
</script>
</body></html>
