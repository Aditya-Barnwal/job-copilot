# Nightly pipeline (installed as a macOS LaunchAgent by `make schedule-install`).
timezone: Asia/Kolkata
daily_run: "19:00"     # discover -> filter -> score -> tailor -> fill-plan; ready by 20:00
rss_poll_hours: 2      # short RSS feeds (Jobspresso) that only hold the last ~10 posts
daily_probe_limit: 1000   # India-probe boards per nightly run (platform caps still apply)
