  # switching this row to `connector: smartrecruiters` needs an explicit robots exemption first.
  - { name: Freshworks, sector: tech, connector: manual, ats: smartrecruiters, slug: Freshworks, tier: brand, tier_reason: "public company, Chennai/Bengaluru engineering", careers_url: "https://careers.smartrecruiters.com/Freshworks", note: "SmartRecruiters API disallowed by robots.txt; apply by hand" }
