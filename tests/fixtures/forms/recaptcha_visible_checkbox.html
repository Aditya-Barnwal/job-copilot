<!doctype html>
<!-- A visible reCAPTCHA checkbox (the ~304x78 anchor frame, no .g-recaptcha div):
     a challenge the person must solve, so the fill pauses. -->
<html><head><meta charset="utf-8"><title>Apply</title></head>
<body>
<form action="/submit" method="post">
  <p><label for="first">First name</label> <input id="first" name="first_name"></p>
  <p><label for="email">Email</label> <input id="email" type="email" name="email"></p>
  <div><iframe title="reCAPTCHA" width="304" height="78" src="/recaptcha/api2/anchor?ar=1&amp;k=test-key&amp;size=normal"></iframe></div>
  <button type="submit" id="submit">Submit application</button>
</form>
</body></html>
