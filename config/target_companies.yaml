# target_companies.yaml — companies you specifically want to work at (Phase 1).
#
# Same row format as config/companies.yaml, so every row works with the same
# connectors. Extra fields:
#   tier          brand | funded, with tier_reason saying why
#   yc_batch      Y Combinator batch where known (from yc-oss; never scraped from YC itself)
#   apply_channel ats — apply on the employer's own ATS board (not via a job board / WaaS)
#
# Boards were found by ats_detect / manual recon on 2026-11-11 (docs/SOURCES.md
# "Target companies") and confirmed with one API call each; job counts are as of
# that day and will drift.

companies:
  - { name: LiteLLM, aliases: [BerriAI], sector: tech, connector: ashby, slug: litellm,
      tier: funded, tier_reason: "YC-backed open-source LLM gateway", yc_batch: W23, apply_channel: ats,
      verify: false, note: "careers URL redirects to Ashby; verified live 2026-11-11 (15 roles, 2 in India)" }
  - { name: AiPrise, sector: fintech, connector: ashby, slug: aiprise,
      tier: funded, tier_reason: "YC-backed KYC/identity startup with a Bengaluru team", yc_batch: S22, apply_channel: ats,
      verify: false, note: "verified live 2026-11-11 (23 roles, 10 in Bengaluru)" }
  - { name: Emergent, aliases: ["Emergent Labs"], sector: tech, connector: greenhouse, slug: emergentlabsinc,
