<!doctype html>
<!-- Trimmed STRUCTURE of a Greenhouse job-boards (Remix) application form,
     modelled on a public posting (2026-11-13). Fake company, no personal data.
     Real form: id="application-form", inputs #first_name/#last_name/#email/#phone,
     react-select comboboxes (input role=combobox, label id "<id>-label"),
     hidden file inputs #resume/#cover_letter behind an "Attach" button,
     custom questions #question_<n>, multi-checkbox name="question_<n>[]",
     submitPath https://boards.greenhouse.io/embed/<board>/jobs/<id>,
     confirmationPath /embed/job_app/confirmation?for=<board>&token=<id>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Application for Software Engineer at Examplecorp</title>
<style>
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px)}
  .select__menu{border:1px solid #ccc;max-height:120px;overflow:auto}
  .field-wrapper{margin:8px 0}
</style>
</head>
<body>
<main>
<div class="application--container">
<div class="application--header"><h2 class="application--header--title">Apply for this job</h2></div>
<form method="post" action="/embed/examplecorp/jobs/4001" id="application-form" class="application--form">
  <div class="application--questions">
    <div class="field-wrapper">
      <label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label>
      <input id="first_name" class="input" aria-label="First Name" aria-required="true" type="text" maxlength="255" autocomplete="given-name" value="">
    </div>
    <div class="field-wrapper">
      <label id="last_name-label" for="last_name" class="label">Last Name<span aria-hidden="true">*</span></label>
      <input id="last_name" class="input" aria-label="Last Name" aria-required="true" type="text" maxlength="255" autocomplete="family-name" value="">
    </div>
    <div class="field-wrapper">
      <label id="email-label" for="email" class="label">Email<span aria-hidden="true">*</span></label>
      <input id="email" class="input" aria-label="Email" aria-required="true" type="text" maxlength="255" autocomplete="email" value="">
    </div>
    <fieldset class="phone-input">
      <legend class="visually-hidden">Phone</legend>
      <div class="select">
        <label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
        <input class="select__input" id="country" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="true" aria-controls="country-listbox" value="" data-options="India|United States|Singapore">
        <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
      </div>
      <div class="field-wrapper">
        <label id="phone-label" for="phone" class="label">Phone<span aria-hidden="true">*</span></label>
        <input id="phone" class="input" aria-label="Phone" aria-required="true" type="tel" maxlength="255" value="">
      </div>
    </fieldset>
    <div class="select">
      <label id="candidate-location-label" for="candidate-location" class="label select__label">Location (City)<span aria-hidden="true">*</span></label>
      <input class="select__input" id="candidate-location" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="candidate-location-label" aria-required="true" aria-controls="candidate-location-listbox" value="" data-options="Bengaluru, Karnataka, India|Springfield, Exampleland|Mumbai, Maharashtra, India">
      <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
      <button type="button" class="btn--tertiary">Locate me</button>
    </div>
    <div class="field-wrapper">
      <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
        <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
        <div class="button-container">
          <button type="button" class="btn btn--rounded" id="resume-attach">Attach</button>
          <label class="visually-hidden" for="resume">Attach</label>
          <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
          <button type="button" class="btn btn--rounded" data-testid="resume-dropbox">Dropbox</button>
          <button type="button" class="btn btn--rounded" data-testid="resume-text">Enter manually</button>
          <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload">
        <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
        <button type="button" class="btn btn--rounded" id="cover_letter-attach">Attach</button>
        <label class="visually-hidden" for="cover_letter">Attach</label>
        <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
      </div>
    </div>
    <div class="education--container">
      <div class="select">
        <label id="school--0-label" for="school--0" class="label select__label">School</label>
        <input class="select__input" id="school--0" type="text" role="combobox" aria-labelledby="school--0-label" aria-controls="school--0-listbox" value="" data-options="Example State University|Other">
      </div>
      <div class="select">
        <label id="degree--0-label" for="degree--0" class="label select__label">Degree</label>
        <input class="select__input" id="degree--0" type="text" role="combobox" aria-labelledby="degree--0-label" aria-controls="degree--0-listbox" value="" data-options="Bachelor's Degree|Master's Degree|Doctor of Philosophy (Ph.D.)|Other">
      </div>
    </div>
    <div class="field-wrapper">
      <label id="question_1001-label" for="question_1001" class="label">LinkedIn Profile</label>
      <input id="question_1001" class="input" aria-label="LinkedIn Profile" type="text" maxlength="255" value="">
    </div>
    <div class="field-wrapper">
      <label id="question_1002-label" for="question_1002" class="label">Who is your current or previous employer?<span aria-hidden="true">*</span></label>
      <input id="question_1002" class="input" aria-label="Who is your current or previous employer?" aria-required="true" type="text" maxlength="255" value="">
    </div>
    <div class="select">
      <label id="question_1003-label" for="question_1003" class="label select__label">Are you legally authorized to work in the country in which you are applying?<span aria-hidden="true">*</span></label>
      <input class="select__input" id="question_1003" type="text" role="combobox" aria-labelledby="question_1003-label" aria-required="true" aria-controls="question_1003-listbox" value="" data-options="Yes|No">
      <input required tabindex="-1" aria-hidden="true" class="requiredInput" value="">
    </div>
    <div class="field-wrapper">
      <label id="question_1004-label" for="question_1004" class="label">Which internal tool would you rebuild first, and why?<span aria-hidden="true">*</span></label>
      <textarea id="question_1004" class="input" aria-label="Which internal tool would you rebuild first, and why?" aria-required="true"></textarea>
    </div>
    <fieldset class="checkbox">
      <legend id="question_1005-label" class="label">Please select the country or countries you anticipate working in<span aria-hidden="true">*</span></legend>
      <div class="checkbox__wrapper"><input type="checkbox" id="question_1005[]_1" name="question_1005[]" value="1"><label for="question_1005[]_1">India</label></div>
      <div class="checkbox__wrapper"><input type="checkbox" id="question_1005[]_2" name="question_1005[]" value="2"><label for="question_1005[]_2">Singapore</label></div>
    </fieldset>
  </div>
  <div class="eeoc__container">
    <h3>Voluntary Self-Identification</h3>
    <div class="field-wrapper">
      <label for="gender" id="gender-label">Gender</label>
      <select id="gender" name="gender">
        <option value="">Please select</option>
        <option value="1">Male</option>
        <option value="2">Female</option>
        <option value="3">Decline To Self Identify</option>
      </select>
    </div>
  </div>
  <div class="data-compliance">
    <div class="checkbox__wrapper">
      <input type="checkbox" id="gdpr_consent" name="gdpr_consent" value="1">
      <label for="gdpr_consent">I agree to the Examplecorp Applicant Privacy Notice and consent to the processing of my data.</label>
    </div>
  </div>
  <div class="application--submit"><button type="submit" class="btn btn--rounded" aria-disabled="false">Submit application</button></div>
</form>
</div>
</main>
<script>
// Minimal react-select stand-in: typing filters, an option click/Enter commits.
document.querySelectorAll('input[role="combobox"]').forEach(function (inp) {
  var opts = (inp.dataset.options || '').split('|').filter(Boolean);
  var menu = document.createElement('div');
  menu.id = inp.getAttribute('aria-controls'); menu.setAttribute('role', 'listbox');
  menu.className = 'select__menu'; menu.hidden = true;
  inp.parentNode.appendChild(menu);
  var req = inp.parentNode.querySelector('.requiredInput');
  function render() {
    var q = inp.value.toLowerCase(); menu.innerHTML = '';
    opts.filter(function (o) { return o.toLowerCase().indexOf(q) !== -1 || !q; }).forEach(function (o) {
      var d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = o;
      d.className = 'select__option';
      d.addEventListener('mousedown', function (e) { e.preventDefault(); commit(o); });
      menu.appendChild(d);
    });
    menu.hidden = false; inp.setAttribute('aria-expanded', 'true');
  }
  function commit(o) { inp.value = o; inp.dataset.selected = o; if (req) req.value = o;
    menu.hidden = true; inp.setAttribute('aria-expanded', 'false'); }
  inp.addEventListener('focus', render); inp.addEventListener('input', render);
  inp.addEventListener('blur', function () { setTimeout(function () { menu.hidden = true; }, 50); });
});
document.getElementById('resume-attach').addEventListener('click', function () { document.getElementById('resume').click(); });
// Like the real board: submit goes through script (fetch POST to submitPath), then the confirmation page.
document.getElementById('application-form').addEventListener('submit', function (e) {
  e.preventDefault();
  fetch(this.getAttribute('action'), {method: 'POST', body: new FormData(this)})
    .then(function () { location.href = '/embed/job_app/confirmation?for=examplecorp&token=4001'; });
});
</script>
</body>
</html>
