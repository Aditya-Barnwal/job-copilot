<!doctype html>
<html><head><meta charset="utf-8"><title>Verify</title></head><body>
<!-- A Keka-style email verification step (not seen on the tenants checked). -->
<form id="jobApplicationForm" novalidate>
  <label for="email">Email *</label><input type="email" id="email" name="email" required>
  <label for="otp">Enter the OTP sent to your email</label><input type="text" id="otp" name="otp">
  <button id="jobApplicationSubmitButton">Apply Now</button>
</form>
</body></html>
