# Hard filters + queue knobs. Every value here has a default in jobcopilot/config.py.
# Phase 2 wires these into filtering/scoring; every exclusion is stored with its
# reason and shown in the Excluded view — nothing is dropped silently.

yoe:
  user_yoe: 1          # your years of experience (whole years)
  max_required: 2      # drop roles whose HARD minimum is above this (i.e. 3+ years)
                       # ("preferred"/"nice to have" bars never drop a role; they are flagged)

seniority:
  exclude_senior_titles: true        # senior / staff / principal / lead / manager / L4+ / SDE3 ...
  allow_if_jd_yoe_within_max: true   # ...unless the JD's hard YOE is <= max_required (then a flag)

# Annual floors per currency. Roles with no disclosed pay are kept, flagged, ranked lower.
salary_floors:
  INR: 1500000         # 15 LPA
  USD: 30000           # remote roles abroad — edit to taste
  EUR: 28000

fx_to_inr:             # approximate; used only to compare against the INR floor
  USD: 83.0
  EUR: 90.0

geo:
  india_allow: [remote, hybrid, onsite, unknown]
  india_preferred_cities: [bengaluru, bangalore]
  outside_india_allow: [remote]                 # outside India: fully remote only
  outside_india_require_india_eligible: true    # "Remote – US only" is excluded
  min_ist_overlap_hours: 3                      # time-zone overlap with IST for remote-abroad
  workday_hours: 8                              # overlap = workday_hours - |their UTC offset - 5.5|
  scan_description: true                        # also honour "US only" / "must be based in the EU" in the JD
  keep_unknown_country: true                    # unknown country: kept, flagged

roles:
  # Role taxonomy (approved 2026-11-12). Every family is matched on whole words in the title
  # (jobcopilot/filters.py _FAMILY_RULES); set its tier here:
  #   primary | secondary   target everywhere (fit role score 100 / 85, config/scoring.yaml)
  #   startup_only          target only at funded / watchlist companies (flag role:startup-only,
  #                         role score 60); at brand / unknown companies: excluded, reason "role"
  #   off                   not a target: excluded with reason "role" (still shown in Excluded)
  # Non-engineering functions (sales / marketing / support / customer success / recruiter /
  # trainer / tutor / annotator / validator / product-program-project manager) never match.
  families:
    sde: primary               # Software Engineer / SDE / SWE (I/II), associate, graduate, trainee, GET
    backend: primary           # Backend Engineer / Developer, Go / Node / ... developer
    java: primary              # Java / Spring Boot Developer
    python: primary            # Python / Django Developer
    ai: primary                # AI / Applied AI / GenAI / LLM / agentic / prompt / conversational / voice / speech
    nlp: primary
    ml: primary                # ML Engineer / MLE / deep learning
    cv: primary                # Computer Vision Engineer / CV Engineer
    data_engineering: primary  # Data Engineer / Big Data Engineer
    data_science: primary      # Data Scientist / DS / Applied Scientist
    fde: primary               # FDE / Forward Deployed (AI / Software) Engineer
    founding: primary          # Founding Engineer / Product Engineer
    amts: primary              # Associate Member of Technical Staff / AMTS (entry level)
    data_analyst: secondary    # "Data Analyst" / DA only (plain / business / financial analyst never)
    analytics_engineering: secondary
    mlops: secondary
    fullstack: secondary
    platform: startup_only
    cloud: startup_only        # Cloud / GCP / AWS / Azure Engineer
    integration: startup_only  # Integration / API Engineer
    research_engineering: startup_only
    research_science: startup_only   # Research Scientist / AI researcher (degree rule still applies)
    sre: startup_only
    observability: startup_only
    devops: startup_only
    qa: startup_only           # SDET / Software Engineer in Test / QA Automation
    solutions: startup_only    # Solutions Engineer (Sales Engineer is always rejected)
    mts: "off"                 # Member of Technical Staff reads as senior; AMTS is kept
    etl: "off"                 # ETL Developer (Data Engineer covers it)
    rules_engine: "off"        # Rules engine / BRMS / Drools developer
    mobile: "off"
    frontend: "off"            # frontend-only ("Software Engineer, Frontend")
  startup_tiers: [funded, watchlist]   # company tiers where startup_only families count
  allow_analyst_titles: true  # false switches the data_analyst family off
  extra_phrases: []           # extra title phrases to accept (whole words), e.g. ["solutions architect"]
  exclude_internships: true   # intern / co-op / apprentice titles are excluded (reason "role")

companies:
  require_tier: [brand, funded]   # recognised brand OR seriously funded startup
  funded_min_stage: series_a
  yc_counts_as_funded: true
  # Extended watchlist: companies that are not brand/funded, but appear on a curated
  # early-career list (SimplifyJobs new-grad, speedyapply, zshah internships). They are
  # fetched into a SEPARATE lane (tier 'watchlist'), never mixed into the main queue.
  # Body shops stay excluded. Set include_extended: false to switch the lane off.
  watchlist:
    enabled: true
    signals: [simplify-newgrad, speedyapply, zshah]
    min_signals: 2        # named by at least this many curated lists (1 = ~4,400 companies, 2 = ~2,500)
  include_extended: true
  # Employers with tier 'unknown' or not in the companies table at all (common for job-board
  # postings). extended = keep them in the extended lane with flag "company:unverified" so
  # nothing good is lost; excluded = drop them with reason "company".
  unknown_tier_lane: extended

freshness:
  stale_flag_days: 60   # older postings are flagged "stale"; age never excludes a job

queue:
  daily_target_min: 15
  daily_target_max: 25
  max_per_company: 3
