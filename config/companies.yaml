# companies.yaml — your seed list.
#
# IMPORTANT, read this first:
#   Every slug / tenant / site below is a BEST GUESS, not a verified value.
#   ATS choices and board tokens change, and I can't confirm them from here.
#   Before trusting a live pull, verify each company in ~30 seconds:
#
#     1. Open the company careers page.
#     2. Click any job, then look at where the "Apply" button / URL points:
#          boards.greenhouse.io/<slug>        -> connector: greenhouse, slug=<slug>
#          jobs.lever.co/<slug>               -> connector: lever,      slug=<slug>
#          jobs.ashbyhq.com/<slug>            -> connector: ashby,      slug=<slug>
#          job-boards.eu.greenhouse.io/<slug> -> connector: greenhouse, slug=<slug>, region: eu
#          <tenant>.wd{N}.myworkdayjobs.com/  -> connector: workday
#                                                tenant=<tenant>, wd_server=wd{N},
#                                                site=<path segment after the locale>
#          careers.smartrecruiters.com/<id>   -> connector: smartrecruiters, slug=<id>
#          jobs.gem.com/<slug>                -> connector: gem,        slug=<slug>
#          anything else (amazon.jobs, careers.google.com, higher.gs.com, ...)
#                                             -> connector: manual (do by hand)
#
#   Set `verify: false` once you've confirmed a row works.
#
#   Or let the detector do steps 1-2 and confirm with one API call:
#     .venv/bin/python -c "from jobcopilot.ats_detect import detect, to_company_config as t; \
#       print(t(detect('https://example.com/careers'), 'Example'))"
#
# Fields:
#   name      display name
#   sector    tech | fintech   (drives the optional sector filter)
#   connector greenhouse | lever | ashby | workday | smartrecruiters | gem | manual
#   slug      board token (greenhouse/lever/ashby/gem) or company id (smartrecruiters)
#   region    greenhouse only: eu for job-boards.eu.greenhouse.io boards (same public API)
#   tenant, wd_server, site   (workday only)
#   tier      brand | funded — why the company is worth applying to (tier_reason says why)
#   ats       on manual rows: the ATS we found but cannot (or may not) pull from
#   note, verify              (housekeeping)

companies:
  # ---- Big tech / proprietary portals: no clean public feed -> manual ----
  - { name: Google,        sector: tech,    connector: manual, note: "careers.google.com — proprietary; jobs API is partner-only" }
  - { name: Microsoft,     sector: tech,    connector: manual, note: "careers.microsoft.com — proprietary search endpoint" }
  - { name: Amazon,        sector: tech,    connector: manual, note: "amazon.jobs — proprietary" }
  - { name: Oracle,        sector: tech,    connector: manual, note: "Oracle Recruiting Cloud (own system)" }

  # ---- Finance / enterprise: mostly Workday or bespoke ----
  - { name: Goldman Sachs, sector: fintech, connector: manual, note: "higher.gs.com — bespoke; needs a custom connector" }
  - { name: JP Morgan,     sector: fintech, connector: manual, note: "Oracle Recruiting Cloud — needs an Oracle connector (not built yet)" }
  - { name: Wells Fargo,   sector: fintech, connector: manual, note: "own recruiting portal — verify; may be Workday" }
  - { name: D.E. Shaw,     sector: fintech, connector: manual, note: "bespoke careers page" }

  - { name: PayPal,        sector: fintech, connector: workday, tenant: paypal, wd_server: wd1, site: jobs,                 tier: brand, tier_reason: "public company, global payments brand", verify: true, note: "GUESS — confirm tenant/wd_server/site on the careers URL" }
  - { name: Adobe,         sector: tech,    connector: workday, tenant: adobe,  wd_server: wd5, site: external_experienced, tier: brand, tier_reason: "public company, household software brand", verify: true, note: "GUESS — confirm tenant/wd_server/site on the careers URL" }

  # ---- Likely on a clean public feed (Greenhouse/Lever/Ashby) ----
  - { name: Uber,          sector: tech,    connector: manual, note: "uses iCIMS (apply URL contains icims.com); not supported by our 4 connectors" }
  - { name: Okta,          sector: tech,    connector: greenhouse, slug: okta,     tier: brand, tier_reason: "public company, identity-platform leader", verify: true, note: "GUESS — confirm apply-URL domain & slug" }
  - { name: BalkanID,      sector: tech,    connector: manual, apply_method: email, contact_email: "hiring@balkan.id", note: "no ATS board — applications by email" }
  # TODO verify: open motorq.com careers, click a job, read the apply-URL domain, then set connector + slug and verify:false
  - { name: Motorq,        sector: tech,    connector: manual, verify: true, note: "ATS unconfirmed — check apply URL: greenhouse/lever/ashby/workday?" }

