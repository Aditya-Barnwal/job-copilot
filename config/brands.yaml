# brands.yaml — company tier signals. EDIT FREELY: this is your list, not ground truth.
#
# Read by jobcopilot/companies.py (compute_tier). After editing, re-run
#   python -m jobcopilot.discovery tiers
# so every company's tier + reasons are recomputed.
#
#   brands       recognised product / tech companies  -> tier "brand"
#   brand_domains  same, matched on the company's website domain (subdomains count)
#   body_shops   IT-services / staffing firms          -> tier "excluded"
#     names      exact company names (matched after normalisation, so
#                "Infosys Limited" == "Infosys")
#     patterns   whole-word keywords in the normalised name. Applied ONLY when the
#                company has no positive signal (brand, YC batch, funding stage,
#                config tier), so a YC startup called "Staffing AI" that builds a
#                product is not thrown out by the word "staffing".
#     allow      names that contain a keyword but must never be excluded
#
# Matching is case/punctuation-insensitive. A tier set in config/companies.yaml
# (`tier: brand`) always wins over anything here.

