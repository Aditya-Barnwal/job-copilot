<!doctype html>
<html><head><meta charset="utf-8"><title>Apply: Software Engineer</title></head>
<body>
<h1>Software Engineer</h1>
<form id="app" action="/submit" method="post" enctype="multipart/form-data">
  <p><label for="first">First name *</label> <input id="first" name="first_name" required></p>
  <p><label for="email">Email *</label> <input id="email" type="email" name="email" required></p>
  <p><label for="country">Country</label>
     <select id="country" name="country"><option value="">Select...</option><option>India</option><option>United States</option></select></p>
  <fieldset><legend>Do you require visa sponsorship?</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label>
  </fieldset>
  <p><label for="why">Why do you want to work here?</label><br><textarea id="why" name="why"></textarea></p>
  <p><label><input type="checkbox" id="consent" name="consent"> I agree to the privacy policy and consent to data processing</label></p>
  <input type="text" name="website_url" id="hp1" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off">
  <input type="text" name="beecatcher" id="bee" style="display:none">
  <p><label for="resume">Resume/CV</label> <input id="resume" type="file" name="resume" accept=".pdf"></p>
  <p><button type="submit" id="submit">Submit application</button></p>
</form>
</body></html>
